<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Simulación de Crédito</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Banco UARO ;)</h1>
        <h2>Simulador de Crédito Personal</h2>
        
        <form id="credit-form">
            <label for="monto">Monto del Crédito Solicitado ($):</label>
            <input type="number" id="monto" value="150000" required>
            
            <label for="tasa">Tasa de Interés Anual Ordinaria (%):</label>
            <input type="number" id="tasa" value="34" step="0.1" required>
            
            <label for="plazo">Plazo del Financiamiento (Meses):</label>
            <select id="plazo">
                <option value="12">12 meses</option>
                <option value="24">24 meses</option>
                <option value="36">36 meses</option>
                <option value="48" selected>48 meses</option>
            </select>

            <!-- Botón requerido por el script.js de la Fase 3 -->
            <button type="button" id="btn-calcular">Calcular Simulación</button>
        </form>

        <!-- Tabla requerida por el script.js de la Fase 3 -->
        <table id="tabla-amortizacion">
            <thead>
                <tr>
                    <th>Periodo</th>
                    <th>Interés</th>
                    <th>IVA</th>
                    <th>Pago Mensual Total</th>
                </tr>
            </thead>
            <tbody>
                <!-- Aquí se inyectarán los resultados con JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- Enlace al archivo de lógica funcional -->
    <script src="script.js"></script>
</body>
</html>
